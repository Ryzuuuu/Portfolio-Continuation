<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the saved (or system) theme before first paint, so there's no flash of
         the wrong one. Keep the key and colours in sync with src/hooks/useTheme.js. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("theme");
          theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (error) {
          // Storage blocked: fall back to the light theme.
        }
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") {
          document.querySelector('meta[name="theme-color"]').content = "#131210";
        }
      })();
    </script>
    <title>Neelabja Mukhopadhyay — AI/ML Engineer</title>
    <meta
      name="description"
      content="Neelabja Mukhopadhyay — AI/ML engineer building computer vision systems, LLM agents, and Python backend services."
    />
    <!-- The SITE_URL tokens and the JSON-LD below are filled in from src/data/profile.js by the
         site-meta plugin in vite.config.js. Tags that need SITE_URL are left out of the build
         until it's set to a real domain. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Neelabja Mukhopadhyay" />
    <meta property="og:title" content="Neelabja Mukhopadhyay — AI/ML Engineer" />
    <meta
      property="og:description"
      content="Computer vision systems, LLM agents, and Python backend services — built, tested, and shipped."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Manga-style portrait of Neelabja Mukhopadhyay beside the words “I build systems that see.”"
    />
    <meta property="profile:first_name" content="Neelabja" />
    <meta property="profile:last_name" content="Mukhopadhyay" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Neelabja Mukhopadhyay — AI/ML Engineer" />
    <meta
      name="twitter:description"
      content="Computer vision systems, LLM agents, and Python backend services — built, tested, and shipped."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Manga-style portrait of Neelabja Mukhopadhyay beside the words “I build systems that see.”"
    />

    <script type="application/ld+json">
      %JSON_LD%
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Manga display face for the Japanese glyphs only (ジーッ創作物語品経験道具連絡続く見済), subset to a few KB. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E3%82%B8%E3%83%BC%E3%83%83%E5%89%B5%E4%BD%9C%E7%89%A9%E8%AA%9E%E5%93%81%E7%B5%8C%E9%A8%93%E9%81%93%E5%85%B7%E9%80%A3%E7%B5%A1%E7%B6%9A%E3%81%8F%E8%A6%8B%E6%B8%88&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
